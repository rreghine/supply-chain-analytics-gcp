version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: user_id
        tests:
          - not_null
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ['Complete', 'Cancelled', 'Returned', 'Processing', 'Shipped']

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: sale_price
        tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null

  - name: stg_distribution_centers
    columns:
      - name: distribution_center_id
        tests:
          - unique
          - not_null

  - name: stg_users
    columns:
      - name: user_id
        tests:
          - unique
          - not_null